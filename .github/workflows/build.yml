name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: |
          mkdir proj
          unzip -q *.zip -d proj
          D=$(dirname "$(find proj -name gradlew | head -n 1)")
          echo "PROJ=$D" >> $GITHUB_ENV
      - name: Build
        run: |
          cd "$PROJ"
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: proj/**/build/outputs/apk/debug/*.apk
